<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>電話帳｜トレイン</title><style>body{margin:0;font-family:system-ui,"Noto Sans JP",sans-serif;background:linear-gradient(150deg,#e7f4ff,#fff1f5);color:#18324c}.wrap{max-width:650px;margin:auto;padding:16px}h1{text-align:center}.item{display:flex;align-items:center;gap:8px;margin:9px 0;padding:8px;background:white;border-radius:17px;box-shadow:0 3px 10px #0002}.call{flex:1;min-width:0;text-align:left;border:2px solid #6b99c5;background:linear-gradient(#fff,#e8f2ff);border-radius:40px;padding:13px 18px;touch-action:pan-y;user-select:none;-webkit-user-select:none;font-size:16px;cursor:pointer}.name{font-weight:800;display:block}.number{display:block;color:#4b5563}.edit{border:0;background:#fff0f0;border-radius:12px;padding:12px;font-size:18px;cursor:pointer}button{font-family:inherit}.back{border:0;border-radius:12px;background:#235eae;color:white;padding:12px 22px;font-size:17px}.hint{line-height:1.6;color:#43556b}</style></head><body><main class="wrap"><h1>☎ トレイン 電話帳</h1><p class="hint">10件登録できます。長丸ボタンのどこでも2秒長押しで名前・番号を変更。短押しで電話アプリを開きます。右の鉛筆でも編集できます。</p><div id="list"></div><button class="back" onclick="location.href='index.html'">メイン画面へ戻る</button></main><script>
const list=document.getElementById('list');
function data(i){return {name:localStorage.getItem('phone_name_'+i)||'未登録',num:localStorage.getItem('phone_num_'+i)||''}}
function edit(i){const old=data(i),name=prompt('登録名',old.name);if(name===null)return;const num=prompt('電話番号',old.num);if(num===null)return;const clean=num.trim();if(clean&&!/^[0-9+()\-\s]+$/.test(clean)){alert('電話番号の形式を確認してください');return}localStorage.setItem('phone_name_'+i,name.trim()||'未登録');localStorage.setItem('phone_num_'+i,clean);render()}
function call(i){const n=data(i).num.replace(/[()\-\s]/g,'');if(!n){alert('番号未登録です。2秒長押しで登録してください。');return}location.href='tel:'+n}
function render(){list.replaceChildren();for(let i=0;i<10;i++){const d=data(i),row=document.createElement('div');row.className='item';const btn=document.createElement('button');btn.className='call';btn.type='button';const n=document.createElement('span');n.className='name';n.textContent=(i+1)+'. '+d.name;const v=document.createElement('span');v.className='number';v.textContent=d.num||'番号未登録';btn.append(n,v);let timer=null,long=false,start=null;const clear=()=>{if(timer!==null){clearTimeout(timer);timer=null}};btn.addEventListener('pointerdown',e=>{if(e.button!==0)return;long=false;start=[e.clientX,e.clientY];clear();timer=setTimeout(()=>{timer=null;long=true;edit(i)},2000)});btn.addEventListener('pointermove',e=>{if(start&&Math.hypot(e.clientX-start[0],e.clientY-start[1])>12)clear()});btn.addEventListener('pointerup',clear);btn.addEventListener('pointercancel',clear);btn.addEventListener('contextmenu',e=>e.preventDefault());btn.addEventListener('click',()=>{if(long){long=false;return}call(i)});const pencil=document.createElement('button');pencil.className='edit';pencil.textContent='✎';pencil.setAttribute('aria-label','編集');pencil.onclick=()=>edit(i);row.append(btn,pencil);list.append(row)}}render();
</script></body></html>
