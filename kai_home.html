<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>介護福祉士 訓練問題</title><style>body{margin:0;background:#eef6ff;font-family:system-ui,"Noto Sans JP",sans-serif;color:#18283b}.wrap{max-width:780px;margin:auto;padding:14px}.card{background:white;border:2px solid #bad8ff;border-radius:18px;padding:18px;margin:12px 0}h1{font-size:23px}button{font-size:17px;border-radius:12px;padding:12px;cursor:pointer;border:2px solid #2469b9;background:#fff;color:#124f98}.choice{display:block;width:100%;text-align:left;margin:10px 0}.correct{background:#fce7f3;border-color:#db2777}.wrong{background:#fef2f2;border-color:#dc2626}.actions{display:flex;gap:8px;flex-wrap:wrap}.actions button{flex:1}.meta{color:#536275}input{font-size:19px;padding:10px;width:110px;border:1px solid #94a3b8;border-radius:10px}#feedback{font-weight:700;min-height:2em}.small{font-size:13px;color:#52616c}</style></head><body><main class="wrap"><h1>介護福祉士 4択訓練</h1><p class="small">独自作成の練習問題です。国家試験の公式過去問ではありません。正確性・難易度は未検証です。</p><div class="card"><div id="count" class="meta"></div><h2 id="question"></h2><div id="choices"></div><p id="feedback" aria-live="polite"></p><div class="actions"><button id="prev">前へ</button><button id="next">次へ</button><button onclick="location.href='index.html'">メイン画面</button></div></div><div class="card"><label for="jump">問題番号から開始：</label><input type="number" id="jump" min="1" inputmode="numeric"><button id="go">移動</button><p class="small">出題順は固定。最後の問題の次は第1問に戻ります。途中で閉じても続きから再開します。</p><button id="reset">進捗リセット</button></div></main><script src="quiz-data.js"></script><script>
const q=window.TRAIN_QUESTIONS||[],key='train_quiz_progress_1002';let idx=Math.max(0,Math.min(q.length-1,Number(localStorage.getItem(key))||0));let answered=false;const $=id=>document.getElementById(id);function render(){if(!q.length)return;$('count').textContent='第 '+(idx+1)+' 問 / '+q.length+' 問';$('question').textContent=q[idx].text;$('choices').replaceChildren();$('feedback').textContent='';answered=false;q[idx].choices.forEach((c,i)=>{const b=document.createElement('button');b.className='choice';b.textContent=(i+1)+'. '+c;b.onclick=()=>{if(answered)return;answered=true;[...$('choices').children].forEach((el,j)=>{el.disabled=true;if(j===q[idx].answer)el.classList.add('correct');else if(j===i)el.classList.add('wrong')});$('feedback').textContent=i===q[idx].answer?'正解です。':'不正解です。正解は '+(q[idx].answer+1)+' 番です。'};$('choices').append(b)});localStorage.setItem(key,String(idx))}function move(n){idx=(n+q.length)%q.length;render()}$('prev').onclick=()=>move(idx-1);$('next').onclick=()=>move(idx+1);$('go').onclick=()=>{const n=Number($('jump').value);if(!Number.isInteger(n)||n<1||n>q.length){alert('1～'+q.length+'の番号を入力してください');return}move(n-1)};$('reset').onclick=()=>{if(confirm('問題の進捗を最初に戻しますか？'))move(0)};render();
</script></body></html>
