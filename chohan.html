<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>丁半サイコロ（派手配色版・$表示・所持金保存）</title>
<style>
  :root{
    /* 指定カラー（これだけで構成） */
    --frame-brown-1:#4a1f09;
    --frame-brown-2:#7a3a14;
    --frame-brown-3:#2b1107;

    /* べっ甲 */
    --t1:#2a1206; --t2:#3a1a08; --t3:#1e0d05;
    --t4:rgba(255,180,60,.30);
    --t5:rgba(255,120,20,.26);
    --t6:rgba(255,220,90,.18);
    --t7:rgba(120,60,10,.40);
    --t8:rgba(90,40,10,.36);
    --t9:rgba(60,25,8,.46);

    /* 窓＝青 */
    --window-blue-1:#0a3e9a;
    --window-blue-2:#0b66ff;
    --window-blue-3:#04204f;

    /* サイコロ背景＝黄色 */
    --dice-yellow-1:#ffd400;
    --dice-yellow-2:#ffb700;

    /* お金表示枠＝赤 */
    --money-red-1:#b10f18;
    --money-red-2:#ff2b2b;

    /* 1万円スタート＝グリーン */
    --reset-green-1:#0bb84a;
    --reset-green-2:#00ff66;

    --text:#fff2d4;
    --muted:#ffeabf;
    --paper:#efe6cc; --paper2:#d8cfb1;
  }

  *{box-sizing:border-box}
  body{
    margin:0;
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    background:
      radial-gradient(1200px 700px at 50% 10%, rgba(255,60,70,.18), transparent 55%),
      radial-gradient(900px 600px at 70% 70%, rgba(255,240,120,.18), transparent 60%),
      radial-gradient(900px 600px at 20% 75%, rgba(0,255,120,.14), transparent 60%),
      linear-gradient(#02020a, #060616 65%, #02020a);
    color:var(--text);
    font-family:"Hiragino Mincho ProN","Yu Mincho","MS Mincho",serif;
  }

  .machine{
    width:min(860px, 96vw);
    border-radius:30px;
    padding:14px;
    filter: drop-shadow(0 34px 46px rgba(0,0,0,.65));
  }

  /* 外枠：すごく太い茶色 */
  .frame{
    border-radius:30px;
    padding:14px;
    background: linear-gradient(145deg, var(--frame-brown-1), var(--frame-brown-3));
    border:18px solid var(--frame-brown-2);
    position:relative;
    box-shadow:
      inset 0 0 0 6px rgba(0,0,0,.55),
      0 18px 30px rgba(0,0,0,.45);
  }
  .frame::before{
    content:"";
    position:absolute; inset:10px;
    border-radius:22px;
    border:10px solid rgba(255,210,120,.20);
    pointer-events:none;
  }
  .frame::after{
    content:"";
    position:absolute; inset:26px;
    border-radius:16px;
    border:10px solid rgba(0,0,0,.55);
    pointer-events:none;
  }

  /* 中：べっ甲柄 */
  .floor{
    border-radius:20px;
    padding:16px;
    position:relative;
    overflow:hidden;
    background:
      radial-gradient(900px 420px at 50% 0%, rgba(255,255,255,.10), transparent 60%),
      radial-gradient(700px 700px at 75% 70%, rgba(0,0,0,.22), transparent 58%),
      radial-gradient(650px 650px at 22% 78%, rgba(0,0,0,.18), transparent 58%),
      radial-gradient(140px 120px at 20% 35%, var(--t4), transparent 60%),
      radial-gradient(210px 170px at 78% 30%, var(--t5), transparent 62%),
      radial-gradient(160px 120px at 42% 68%, var(--t6), transparent 63%),
      radial-gradient(240px 200px at 65% 72%, var(--t7), transparent 64%),
      radial-gradient(220px 180px at 25% 78%, var(--t8), transparent 64%),
      radial-gradient(180px 140px at 55% 42%, var(--t9), transparent 62%),
      linear-gradient(135deg, var(--t1), var(--t2) 35%, var(--t3));
    box-shadow:
      inset 0 0 0 3px rgba(0,0,0,.55),
      inset 0 0 30px rgba(0,0,0,.20);
  }

  .dragons{
    position:absolute; inset:0;
    pointer-events:none;
    opacity:.22;
    mix-blend-mode: screen;
    background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='240' height='180' viewBox='0 0 240 180'><defs><linearGradient id='g' x1='0' y1='0' x2='1' y2='1'><stop offset='0' stop-color='%23ffea00' stop-opacity='.9'/><stop offset='.55' stop-color='%2300b7ff' stop-opacity='.6'/><stop offset='1' stop-color='%23ff2b2b' stop-opacity='.55'/></linearGradient></defs><path d='M24 120c22-10 25-30 43-45 19-15 44-18 64-7 19 11 24 32 9 48-12 13-35 17-54 8 16-1 28-7 32-15 8-12 2-24-10-29-12-6-30-3-42 7-12 10-16 26-29 39-13 13-35 19-59 14 18-3 30-10 44-23z' fill='none' stroke='url(%23g)' stroke-width='6' stroke-linecap='round' stroke-linejoin='round'/><path d='M142 48c6-10 16-16 29-17 13-1 25 4 33 14 8 10 10 22 6 34-4 12-13 20-25 25 9-8 13-17 13-26 0-10-6-19-15-22-10-4-22 1-28 10-4 6-7 14-13 20-6 6-14 10-25 10 11-5 17-12 20-19 3-7 3-18 5-29z' fill='none' stroke='url(%23g)' stroke-width='5' stroke-linecap='round' stroke-linejoin='round' opacity='.9'/></svg>");
    background-size:240px 180px;
    background-repeat:repeat;
  }
  .paint{
    position:absolute; inset:-40px;
    pointer-events:none;
    opacity:.60;
    mix-blend-mode: screen;
    background:
      radial-gradient(closest-side at 18% 25%, rgba(255,40,40,.20), transparent 60%),
      radial-gradient(closest-side at 85% 25%, rgba(255,240,0,.20), transparent 62%),
      radial-gradient(closest-side at 65% 85%, rgba(0,190,255,.18), transparent 60%),
      repeating-linear-gradient(125deg, rgba(255,255,255,.12) 0 7px, rgba(255,255,255,0) 7px 22px);
    animation: sweep .9s linear infinite;
  }
  @keyframes sweep{
    from{ transform: translateX(-18px) translateY(12px); }
    to{ transform: translateX(18px) translateY(-12px); }
  }

  /* 窓：青色 */
  .window{
    position:relative;
    border-radius:18px;
    padding:14px;
    background:
      radial-gradient(900px 420px at 50% -40%, rgba(255,255,255,.14), transparent 60%),
      linear-gradient(180deg, rgba(255,255,255,.10), rgba(255,255,255,.02)),
      linear-gradient(135deg, var(--window-blue-1), var(--window-blue-2) 55%, var(--window-blue-3));
    border:6px solid rgba(255,240,150,.28);
    box-shadow:
      inset 0 0 0 3px rgba(0,0,0,.55),
      0 14px 22px rgba(0,0,0,.30);
  }

  .title{
    display:flex;
    align-items:baseline;
    justify-content:space-between;
    gap:12px;
    padding:6px 8px 10px;
  }
  .title h1{
    margin:0;
    font-size:18px;
    letter-spacing:.14em;
    font-weight:900;
    text-shadow: 0 0 14px rgba(255,240,0,.22);
  }
  .title .sub{
    font-size:12px;
    color:rgba(255,255,255,.90);
    letter-spacing:.08em;
  }

  .history{
    display:flex;
    justify-content:space-between;
    gap:10px;
    padding:10px 8px 14px;
  }
  .hist{
    width:54px; height:38px;
    border-radius:10px;
    display:flex;
    align-items:center;
    justify-content:center;
    font-weight:900;
    font-size:16px;
    letter-spacing:.18em;
    border:3px solid rgba(255,240,0,.30);
    background: rgba(0,0,0,.35);
    box-shadow: inset 0 0 0 2px rgba(0,0,0,.45);
  }
  .hist.cho{ color:#ffea00; }
  .hist.han{ color:#ff2b2b; }
  .hist.empty{
    color: rgba(255,255,255,.22);
    border-color: rgba(255,240,0,.14);
    background: rgba(0,0,0,.20);
  }

  .grid{
    display:grid;
    grid-template-columns: 1fr 1fr;
    gap:12px;
    padding:8px;
  }

  .btn{
    border-radius:14px;
    padding:14px 12px;
    text-align:center;
    user-select:none;
    cursor:pointer;
    background:
      linear-gradient(180deg, rgba(255,255,255,.14), rgba(255,255,255,.03)),
      rgba(0,0,0,.35);
    border:3px solid rgba(255,240,0,.28);
    box-shadow:
      inset 0 0 0 2px rgba(0,0,0,.45),
      0 10px 18px rgba(0,0,0,.25);
    letter-spacing:.12em;
    font-weight:900;
    text-shadow: 0 0 10px rgba(0,0,0,.55);
    transition: transform .08s ease, filter .08s ease, background .08s ease, box-shadow .08s ease;
  }
  .btn:active{ transform: translateY(1px) scale(.995); }
  .btn.active{
    filter: brightness(1.26);
    border-color: rgba(0,255,120,.65);
    box-shadow:
      inset 0 0 26px rgba(0,255,120,.16),
      0 0 22px rgba(255,240,0,.22),
      0 12px 18px rgba(0,0,0,.34);
  }
  .btn.small{ padding:12px 10px; font-size:15px; }
  .btn.big{ grid-column:1 / -1; padding:16px 12px; font-size:18px; }

  /* 掛け金ボタン：表示だけ $ にする */
  .bill{
    color:#13131a;
    text-shadow:none;
    border-color: rgba(0,0,0,.30);
    background:
      radial-gradient(160px 70px at 30% 35%, rgba(255,255,255,.78), transparent 60%),
      radial-gradient(140px 80px at 80% 70%, rgba(0,190,255,.16), transparent 62%),
      repeating-linear-gradient(90deg, rgba(0,0,0,.05) 0 2px, rgba(0,0,0,0) 2px 9px),
      linear-gradient(180deg, var(--paper), var(--paper2));
    box-shadow:
      inset 0 0 0 2px rgba(255,255,255,.35),
      0 10px 16px rgba(0,0,0,.35);
    position:relative;
  }
  .bill::before{
    content:"";
    position:absolute; inset:7px;
    border-radius:10px;
    border:2px dashed rgba(0,0,0,.22);
    pointer-events:none;
  }
  .bill::after{
    content:"";
    position:absolute;
    left:10px; top:10px;
    width:54px; height:26px;
    border-radius:8px;
    background: rgba(0,0,0,.08);
    box-shadow: inset 0 0 0 1px rgba(255,255,255,.18);
    transform: rotate(-2deg);
    pointer-events:none;
  }
  .bill.active{
    border-color: rgba(255,240,0,.95);
    box-shadow:
      0 0 22px rgba(255,240,0,.35),
      0 12px 18px rgba(0,0,0,.35);
  }

  /* START点滅 */
  .btn.start{
    background:
      radial-gradient(240px 90px at 50% 25%, rgba(255,240,0,.22), transparent 70%),
      linear-gradient(180deg, rgba(255,255,255,.10), rgba(255,255,255,.02)),
      rgba(0,0,0,.35);
  }
  .btn.start.flash-red{
    background:
      radial-gradient(260px 100px at 50% 25%, rgba(255,255,255,.18), transparent 70%),
      linear-gradient(180deg, rgba(255,255,255,.10), rgba(0,0,0,.02)),
      #ff2b2b;
    color:#fff;
    border-color: rgba(255,240,0,.75);
    box-shadow:
      0 0 26px rgba(255,40,40,.35),
      0 0 24px rgba(255,240,0,.22),
      0 12px 18px rgba(0,0,0,.40);
  }
  .btn.start.flash-black{
    background:
      radial-gradient(260px 100px at 50% 25%, rgba(255,255,255,.08), transparent 70%),
      linear-gradient(180deg, rgba(255,255,255,.06), rgba(0,0,0,.14)),
      #000;
    color:#ffea00;
    border-color: rgba(255,240,0,.75);
    box-shadow:
      0 0 22px rgba(255,240,0,.22),
      0 12px 18px rgba(0,0,0,.45);
  }

  .dice-row{
    display:grid;
    grid-template-columns: 1fr 1fr;
    gap:12px;
    padding:8px;

    /* ★追加：上に判定枠を乗せるため */
    position:relative;
  }

  /* サイコロ背景：黄色 */
  .dice-box{
    border-radius:18px;
    padding:10px;
    background:
      radial-gradient(circle at 50% 30%, rgba(255,255,255,.18), transparent 55%),
      linear-gradient(135deg, var(--dice-yellow-1), var(--dice-yellow-2));
    border:6px solid rgba(0,0,0,.35);
    box-shadow:
      inset 0 0 0 3px rgba(255,255,255,.20),
      0 12px 18px rgba(0,0,0,.28);
    display:flex;
    align-items:center;
    justify-content:center;
    height:156px;
    position:relative;
    overflow:hidden;
    z-index:1; /* ★追加：判定枠より下でOK */
  }
  .dice-box::after{
    content:"";
    position:absolute; inset:0;
    background: radial-gradient(circle at 50% 30%, rgba(255,255,255,.22), transparent 55%);
    pointer-events:none;
  }
  canvas{ width:126px; height:126px; }

  /* ★追加：2つのサイコロを包む“大きい枠”＋中央の“小さい枠” */
  .judge-wide{
    position:absolute;
    left:8px; right:8px; top:8px; bottom:8px; /* dice-rowのpaddingと合わせる */
    border-radius:18px;
    border:6px solid rgba(0,0,0,.45);
    box-shadow:
      inset 0 0 0 3px rgba(255,255,255,.14),
      0 0 22px rgba(255,240,0,.10);
    pointer-events:none;
    z-index:2; /* サイコロの上に見せる */
    display:flex;
    align-items:center;
    justify-content:center;
  }
  .judge-center{
    width:96px;
    height:58px;
    border-radius:14px;
    display:flex;
    align-items:center;
    justify-content:center;
    font-weight:900;
    font-size:22px;
    letter-spacing:.22em;

    background:
      radial-gradient(circle at 30% 30%, rgba(255,255,255,.55), transparent 60%),
      linear-gradient(135deg, rgba(0,0,0,.62), rgba(0,0,0,.28));
    border:6px solid rgba(255,240,0,.80);
    box-shadow:
      0 0 22px rgba(255,240,0,.35),
      0 0 18px rgba(0,190,255,.18),
      inset 0 0 0 2px rgba(0,0,0,.45);
    color:#fff;
    text-shadow: 0 0 12px rgba(0,0,0,.65);
  }
  .judge-center.wait{
    border-color: rgba(0,190,255,.80);
    box-shadow:
      0 0 22px rgba(0,190,255,.32),
      0 0 18px rgba(255,240,0,.16),
      inset 0 0 0 2px rgba(0,0,0,.45);
    opacity:.92;
  }
  .judge-center.cho{ color:#ffea00; }
  .judge-center.han{ color:#ff2b2b; }

  /* お金表示枠：赤色 */
  .info{
    margin:8px;
    border-radius:14px;
    padding:12px 12px;
    border:5px solid rgba(255,240,0,.25);
    background: linear-gradient(135deg, var(--money-red-1), var(--money-red-2));
    box-shadow:
      inset 0 0 0 3px rgba(0,0,0,.45),
      0 10px 18px rgba(0,0,0,.25);
    font-size:14px;
    letter-spacing:.08em;
  }
  .info strong{ color:#fff; text-shadow: 0 0 10px rgba(0,0,0,.45); }

  .hint{
    padding:0 10px 10px;
    color: rgba(255,255,255,.92);
    font-size:12px;
    letter-spacing:.06em;
    text-shadow: 0 0 10px rgba(0,0,0,.35);
  }

  .footer{ display:flex; gap:12px; padding:8px; }
  .footer .btn{ flex:1; }

  /* 1万円スタート：グリーン（表示は $ に合わせて） */
  #resetBtn{
    background:
      radial-gradient(240px 90px at 50% 25%, rgba(255,255,255,.18), transparent 70%),
      linear-gradient(135deg, var(--reset-green-1), var(--reset-green-2));
    border:5px solid rgba(255,240,0,.28);
    color:#001b08;
    text-shadow:none;
    font-weight:900;
    box-shadow:
      inset 0 0 0 3px rgba(0,0,0,.25),
      0 12px 18px rgba(0,0,0,.25);
  }

  .fx{
    position:absolute; inset:0;
    pointer-events:none;
    opacity:0;
    transition: opacity .12s ease;
  }
  .fx.on{ opacity:1; }
  .fx::before{
    content:"";
    position:absolute; inset:-30px;
    background:
      radial-gradient(closest-side at 25% 25%, rgba(255,40,40,.22), transparent 60%),
      radial-gradient(closest-side at 80% 30%, rgba(255,240,0,.22), transparent 62%),
      radial-gradient(closest-side at 60% 85%, rgba(0,190,255,.18), transparent 60%),
      repeating-linear-gradient(120deg, rgba(255,255,255,.14) 0 7px, rgba(255,255,255,0) 7px 22px);
    animation: fxmove .32s linear infinite;
    mix-blend-mode: screen;
  }
  @keyframes fxmove{
    from{ transform: translateX(-18px) translateY(12px); }
    to{ transform: translateX(18px) translateY(-12px); }
  }

  @media (max-width:420px){
    .hist{ width:48px; }
    canvas{ width:116px; height:116px; }
    .judge-center{ width:88px; height:54px; font-size:20px; }
  }
</style>
</head>
<body>

<div class="machine">
  <div class="frame">
    <div class="floor">
      <div class="dragons"></div>
      <div class="paint"></div>

      <div class="window">
        <div class="fx" id="fx"></div>

        <div class="title">
          <h1>丁半サイコロ</h1>
          <div class="sub">派手配色／所持金は保存</div>
        </div>

        <div class="history" id="history"></div>

        <div class="grid">
          <div class="btn small" id="choBtn">丁（偶数）</div>
          <div class="btn small" id="hanBtn">半（奇数）</div>

          <div class="btn small bill bet" data-bet="100">$100</div>
          <div class="btn small bill bet" data-bet="500">$500</div>
          <div class="btn small bill bet" data-bet="1000">$1000</div>
          <div class="btn small bill bet" data-bet="2000">$2000</div>

          <div class="btn big start" id="startBtn">START</div>
        </div>

        <div class="dice-row">
          <div class="dice-box"><canvas id="c1" width="140" height="140"></canvas></div>
          <div class="dice-box"><canvas id="c2" width="140" height="140"></canvas></div>

          <!-- ★追加：2つのサイコロ中央の判定窓（大枠＋中央小枠） -->
          <div class="judge-wide" aria-hidden="true">
            <div class="judge-center wait" id="judgeCenter">…</div>
          </div>
        </div>

        <div class="info" id="resultInfo">一回の勝ち負け：<strong>$0</strong></div>
        <div class="info" id="moneyInfo">現在の持ち金：<strong>$0</strong></div>
        <div class="hint">※所持金と履歴は記憶されます（次に開いても続きから）。</div>

        <div class="footer">
          <div class="btn" id="resetBtn">$10000スタート</div>
        </div>
      </div>

    </div>
  </div>
</div>

<script>
const KEY_MONEY="chohan_money_v1";
const KEY_HISTORY="chohan_history_v1";

let choice=null, bet=0, money=0, history=[];
const historyDiv=document.getElementById("history");
const choBtn=document.getElementById("choBtn");
const hanBtn=document.getElementById("hanBtn");
const startBtn=document.getElementById("startBtn");
const resetBtn=document.getElementById("resetBtn");
const resultInfo=document.getElementById("resultInfo");
const moneyInfo=document.getElementById("moneyInfo");
const fx=document.getElementById("fx");
const betBtns=[...document.querySelectorAll(".bet")];

/* ★追加：中央判定窓 */
const judgeCenter = document.getElementById("judgeCenter");
function setJudgeCenter(text, mode){ // mode: "wait"|"cho"|"han"
  judgeCenter.textContent = text;
  judgeCenter.classList.remove("wait","cho","han");
  judgeCenter.classList.add(mode);
}

/* $表示（見た目だけ） */
function fmt(n){
  const sign = n<0 ? "-" : "";
  const v = Math.abs(n);
  return sign + "$" + v;
}

function loadState(){
  const m=parseInt(localStorage.getItem(KEY_MONEY)||"0",10);
  money=Number.isFinite(m)?m:0;
  try{
    const h=JSON.parse(localStorage.getItem(KEY_HISTORY)||"[]");
    history=Array.isArray(h)?h.filter(x=>x==="丁"||x==="半"):[];
  }catch{ history=[]; }
}
function saveMoney(){ localStorage.setItem(KEY_MONEY,String(money)); }
function saveHistory(){ localStorage.setItem(KEY_HISTORY,JSON.stringify(history.slice(-50))); }

function updateMoney(){ moneyInfo.innerHTML=`現在の持ち金：<strong>${fmt(money)}</strong>`; }
function updateResult(diff){ resultInfo.innerHTML=`一回の勝ち負け：<strong>${fmt(diff)}</strong>`; }

function drawHistory(){
  historyDiv.innerHTML="";
  const last6=history.slice(-6);
  last6.forEach(r=>{
    const d=document.createElement("div");
    d.className="hist "+(r==="丁"?"cho":"han");
    d.textContent=r;
    historyDiv.appendChild(d);
  });
  for(let i=last6.length;i<6;i++){
    const d=document.createElement("div");
    d.className="hist empty";
    d.textContent="　";
    historyDiv.appendChild(d);
  }
}

loadState();
drawHistory();
updateMoney();
updateResult(0);
setJudgeCenter("…","wait");

function setChoice(v){
  choice=v;
  choBtn.classList.toggle("active", v==="丁");
  hanBtn.classList.toggle("active", v==="半");
}
choBtn.onclick=()=>setChoice("丁");
hanBtn.onclick=()=>setChoice("半");

betBtns.forEach(b=>{
  b.onclick=()=>{
    bet=Number(b.dataset.bet);
    betBtns.forEach(x=>x.classList.remove("active"));
    b.classList.add("active");
  };
});

resetBtn.onclick=()=>{
  money=10000;
  saveMoney();
  updateMoney();
};

/* サイコロ描画 */
const c1=document.getElementById("c1"), c2=document.getElementById("c2");
const ctx1=c1.getContext("2d"), ctx2=c2.getContext("2d");

function roundRect(ctx,x,y,w,h,r){
  ctx.beginPath();
  ctx.moveTo(x+r,y);
  ctx.arcTo(x+w,y,x+w,y+h,r);
  ctx.arcTo(x+w,y+h,x,y+h,r);
  ctx.arcTo(x,y+h,x,y,r);
  ctx.arcTo(x,y,x+w,y,r);
  ctx.closePath();
}
function drawPip(ctx,cx,cy,r){
  const g=ctx.createRadialGradient(cx-2,cy-2,1,cx,cy,r+2);
  g.addColorStop(0,"rgba(60,40,20,.95)");
  g.addColorStop(1,"rgba(10,10,10,.98)");
  ctx.beginPath(); ctx.arc(cx,cy,r,0,Math.PI*2);
  ctx.fillStyle=g; ctx.fill();
}
function drawPips(ctx,x,y,size,face){
  const pad=18;
  const p1=x+pad,p2=x+size/2,p3=x+size-pad;
  const q1=y+pad,q2=y+size/2,q3=y+size-pad;
  const r=7;
  const map={
    1:[[p2,q2]],
    2:[[p1,q1],[p3,q3]],
    3:[[p1,q1],[p2,q2],[p3,q3]],
    4:[[p1,q1],[p3,q1],[p1,q3],[p3,q3]],
    5:[[p1,q1],[p3,q1],[p2,q2],[p1,q3],[p3,q3]],
    6:[[p1,q1],[p3,q1],[p1,q2],[p3,q2],[p1,q3],[p3,q3]],
  };
  (map[face]||[]).forEach(([cx,cy])=>drawPip(ctx,cx,cy,r));
}
function drawDie(ctx,face,rot){
  const w=ctx.canvas.width,h=ctx.canvas.height;
  ctx.clearRect(0,0,w,h);

  ctx.save();
  ctx.translate(w/2,h/2);
  ctx.rotate(rot*0.25);
  ctx.beginPath();
  ctx.ellipse(0,46,52,20,0,0,Math.PI*2);
  ctx.fillStyle="rgba(0,0,0,.35)";
  ctx.filter="blur(6px)";
  ctx.fill();
  ctx.filter="none";
  ctx.restore();

  const size=92;
  const x=(w-size)/2,y=(h-size)/2;

  const g=ctx.createLinearGradient(x,y,x+size,y+size);
  g.addColorStop(0,"rgba(255,255,255,.99)");
  g.addColorStop(.45,"rgba(245,245,245,.92)");
  g.addColorStop(1,"rgba(220,220,220,.96)");

  const hl=ctx.createRadialGradient(x+26,y+18,4,x+26,y+22,46);
  hl.addColorStop(0,"rgba(255,255,255,.78)");
  hl.addColorStop(1,"rgba(255,255,255,0)");

  ctx.save();
  ctx.translate(w/2,h/2);
  ctx.rotate(rot);
  ctx.translate(-w/2,-h/2);

  roundRect(ctx,x,y,size,size,18);
  ctx.fillStyle=g; ctx.fill();

  ctx.strokeStyle="rgba(0,0,0,.25)";
  ctx.lineWidth=2; ctx.stroke();

  ctx.save();
  ctx.globalAlpha=.35;
  ctx.beginPath();
  roundRect(ctx,x+3,y+3,size-6,size-6,16);
  const sh=ctx.createLinearGradient(x,y+size,x+size,y);
  sh.addColorStop(0,"rgba(0,0,0,.35)");
  sh.addColorStop(.55,"rgba(0,0,0,0)");
  sh.addColorStop(1,"rgba(0,0,0,.18)");
  ctx.strokeStyle=sh;
  ctx.lineWidth=7; ctx.stroke();
  ctx.restore();

  ctx.save();
  ctx.globalCompositeOperation="screen";
  roundRect(ctx,x,y,size,size,18);
  ctx.fillStyle=hl; ctx.fill();
  ctx.restore();

  drawPips(ctx,x,y,size,face);
  ctx.restore();
}
drawDie(ctx1,1,0.2);
drawDie(ctx2,1,-0.15);

/* START点滅0.3秒 */
let rolling=false, flashTimer=null, flashState=0;
function startFlash(){
  flashState=0;
  startBtn.classList.add("flash-red");
  startBtn.classList.remove("flash-black");
  fx.classList.add("on");
  flashTimer=setInterval(()=>{
    flashState^=1;
    if(flashState){
      startBtn.classList.add("flash-black");
      startBtn.classList.remove("flash-red");
    }else{
      startBtn.classList.add("flash-red");
      startBtn.classList.remove("flash-black");
    }
  },300);
}
function stopFlash(){
  if(flashTimer){ clearInterval(flashTimer); flashTimer=null; }
  startBtn.classList.remove("flash-red","flash-black");
  fx.classList.remove("on");
}

function rollDice1s(finalA,finalB,onDone){
  const st=performance.now(), dur=1000;
  function tick(now){
    const t=Math.min(1,(now-st)/dur);
    const faceA=(t<1)?(1+Math.floor(Math.random()*6)):finalA;
    const faceB=(t<1)?(1+Math.floor(Math.random()*6)):finalB;
    const ease=1-Math.pow(1-t,3);
    const rotA=(1-t)*16+ease*0.6;
    const rotB=(1-t)*15+ease*0.8;
    drawDie(ctx1,faceA,rotA);
    drawDie(ctx2,faceB,rotB);
    if(t<1) requestAnimationFrame(tick);
    else onDone();
  }
  requestAnimationFrame(tick);
}

/* ゲーム */
startBtn.onclick=()=>{
  if(rolling) return;
  if(!choice || bet===0 || money<bet) return;

  rolling=true;
  startFlash();

  /* ★追加：回転中は「…」 */
  setJudgeCenter("…","wait");

  const a=1+Math.floor(Math.random()*6);
  const b=1+Math.floor(Math.random()*6);

  rollDice1s(a,b,()=>{
    const res=((a+b)%2===0)?"丁":"半";

    /* ★追加：止まった瞬間に中央窓へ結果 */
    setJudgeCenter(res, res==="丁" ? "cho" : "han");

    history.push(res);
    saveHistory();
    drawHistory();

    const diff=(res===choice)?bet:-bet;
    money+=diff;
    saveMoney();

    updateResult(diff);
    updateMoney();

    stopFlash();
    rolling=false;
  });
};
