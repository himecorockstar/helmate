<body>
<header>
  <div class="titleRow">
    <h1>クイズ豆知識５００</h1>
    <button class="backBtn" id="btnBack">戻る</button>
  </div>
</header>

<div class="wrap">
  <div class="panel">
    <p class="stat" id="statLine">５ジャンル×各１００問＝合計５００問。ランダム表示（記憶なし）。</p>

    <div class="chips" id="chipRow">
      <div class="chip active" data-key="ALL">全ジャンル</div>

<footer>※正誤表示・タイマーなし。気軽な読み物モード。</footer>

<script>
/* データ形式： "Q|解説" */
const DATA = {
  COOK: [
"昆布だしは煮立てる?|煮立てるとぬめりと雑味が出やすい。60〜80℃で止めると澄む。",
"かつお節は沸騰後?|沸騰で香りが飛ぶ。火を止め入れて10秒で引き上げると上品。",
"味噌汁は再沸騰する?|再沸騰で香りが消えやすい。温め直しは沸かさず湯気止まり。",
"塩を早く入れない理由?|野菜の水が出て炒め煮が水っぽくなる。塩は仕上げ寄りが安定。",
"砂糖を先に入れる訳?|砂糖は浸透が遅い。先に入れると甘みが芯まで入りやすい。",
"酢を入れるタイミング?|酢は長時間加熱で香りが薄くなる。仕上げに少量で立つ。",
"醤油を鍋肌で焦がす?|鍋肌で焦げて苦味が出る。回し入れ後はすぐ混ぜると安全。",
"みりんは煮切る意味?|みりんのアルコール臭を飛ばす。軽く沸かしてから使うと角が取れる。",
"酒の役割は何?|魚や肉の臭み成分を揮発させやすい。下処理に少量で効果が出る。",
"生姜を最後に入れる?|生姜の香りは飛びやすい。加熱し過ぎず最後に足すと鮮烈。",
"にんにくを焦がさない?|焦げると香りが苦味に変化。弱火で色づく前に具へ移す。",
"玉ねぎを冷やすと涙減?|刺激成分が揮発しにくい。冷蔵庫10分で涙が出にくい人も。",
"包丁で押し切りNG?|繊維が潰れ水が出やすい。引き切りで断面がきれいになる。",
"きのこは洗わない?|水を吸うと香りが弱まる。汚れは刷毛や濡れ布で拭くのが向く。",
"きのこ冷凍で旨味UP?|細胞が壊れ旨味が出やすい。凍ったまま炒めると香りが立つ。",
"トマト湯むきが楽な訳?|皮が口に残りやすい。湯→冷水で皮がスルッと剥ける。",
"大根おろしで味が違う?|繊維の切れ方で辛味が変化。細かいほど辛く、粗いほど甘い。",
"大根の葉は捨てない?|葉は栄養が濃い。刻んで炒めるとご飯のお供になりやすい。",
"ほうれん草のえぐみ対策?|茹でて冷水で締めるとシュウ酸が減る。短時間がコツ。",
"小松菜は茹で不要?|炒めでも食べやすい。硬い茎だけ先に加熱すると時短になる。",
"ブロッコリーは蒸す?|茹でるより水っぽさが減る。レンジ蒸しで甘みが出やすい。",
"じゃがいもは水から?|外だけ柔らかいを防ぐ。水から加熱で中心まで均一になりやすい。",
"里芋のぬめりは何?|ぬめりは食物繊維系。洗いすぎると落ちるので軽めが良い。",
"こんにゃく下茹での意味?|臭み成分が抜ける。熱湯で2〜3分茹でると味が入りやすい。",
"豆腐は塩で水切り?|軽く塩で水が出やすい。短時間で旨味が濃くなり崩れにくい。",
"厚揚げの油抜き必要?|熱湯かけで油臭が減る。煮物の味がスッキリしやすい。",
"鶏むねを柔らかくする?|繊維に直角に切ると噛み切りやすい。低温加熱でパサつき減。",
"豚こまは片栗粉で?|薄くまぶすと肉汁を閉じ込めやすい。炒めても硬くなりにくい。",
"牛肉は焼く前に拭く?|表面の水分で蒸し焼き化する。拭くと焼き色が付き香りが出る。",
"肉は休ませると何が?|切ると肉汁が流れるのを減らす。数分置くとしっとり戻りやすい。",
"魚の皮から焼く理由?|身より縮みやすい皮を先に固定。反り返りを抑えパリッとしやすい。",
"魚の臭み取りは塩?|塩を振り10分で水が出る。拭き取ると臭み成分も一緒に減る。",
"アジの骨が抜けない?|骨抜きは頭側へ引くと切れにくい。逆だと身が裂けやすい。",
"卵焼きは砂糖で硬く?|砂糖は凝固を遅らせるが入れ過ぎで水っぽい。少量でふんわり。",
"ゆで卵は冷水で何が?|急冷で殻と白身が縮み剥けやすい。余熱で固まり過ぎも防ぐ。",
"卵は尖った方を下?|気室が上に来て黄身が中央に寄りやすい。茹で割れも減ることがある。",
"パスタ湯に塩の量は?|湯1Lに塩10g前後が目安。塩味が麺の芯に入りやすい。",
"パスタは水洗いする?|基本しない。洗うと表面のデンプンが落ちソースが絡みにくい。",
"炒飯がベチャる原因?|具を入れ過ぎると水分で崩れる。卵→ご飯→具の順が安定。",
"チャーハンの米は冷やす?|冷やすと粒が締まる。温かい米は潰れやすくベタつきやすい。",
"野菜炒めが水っぽい?|野菜の水分が出る。強火短時間＋塩は最後でシャキッとする。",
"もやしは洗い過ぎ?|水を抱えて炒めが水っぽい。軽くすすぎ、しっかり水切りが重要。",
"キャベツ芯は捨てない?|薄切りで甘い。芯は繊維方向に沿って切ると食べやすい。",
"レタスは包丁で切る?|金属で変色しやすい話も。手でちぎると断面潰れが少ない。",
"天ぷら衣は混ぜない?|混ぜ過ぎでグルテン増、重くなる。粉が少し残る程度が軽い。",
"天ぷらは入れ過ぎNG?|油温が下がり衣が吸油する。少量ずつで温度を保つとサクッ。",
"唐揚げ二度揚げの狙い?|一度目で中まで火、休ませ水分移動。二度目で表面がカリッ。",
"唐揚げに片栗粉多め?|片栗粉は糊化でカリッとする。小麦だけより歯切れが出やすい。",
"フライは油温何度?|170〜180℃が目安。低いと油吸い、高いと中が生になりやすい。",
"揚げ物は網に置く訳?|紙の上だと蒸れてべちゃる。網で空気を通すとカリッが続く。",
"とんかつ筋切りの意味?|縮む筋を切り反りを防ぐ。均一に火が入り衣も割れにくい。",
"餃子の水は熱湯が良い?|冷水で温度が落ちる。熱湯なら焼き面の温度維持でパリッが出る。",
"餃子の蒸し時間は短く?|長いと皮がブヨブヨ。水が消えたら蓋を外し焼き固める。",
"煮物は冷ますと染みる?|冷める時に煮汁が中へ入りやすい。作り置きが美味しい理由。",
"落し蓋の代用品は?|クッキングシートでOK。煮汁が対流し味ムラが減り煮崩れも防ぐ。",
"煮物のアク取りはいつ?|最初に出た泡が雑味になりやすい。沸いた直後に軽く取るのが楽。",
"アクを取り過ぎると?|旨味の油まで取ることも。透明にし過ぎず、軽くがバランス良い。",
"だしパックを絞らない?|絞ると微粉と苦味が出やすい。自然に引き上げる方が澄む。",
"ごまは炒り直しOK?|湿気たごまは軽く乾煎りで香り復活。焦がすと苦いので弱火。",
"海苔は冷蔵が良い?|湿気で香りが落ちる。密閉して冷蔵、使う時は常温で戻すと良い。",
"わさびは醤油に溶く?|溶くと香りが飛びやすい。刺身に付けて醤油へが香りが立つ。",
"ねぎは水にさらす?|辛味は抜けるが香りも落ちる。短時間で切り口だけ洗うと両立。",
"しょうがは皮ごとOK?|香り成分は皮近くに多い。よく洗って薄皮ごと使うと香りが強い。",
"にんじんは油で食べる?|脂と一緒で吸収されやすい栄養がある。炒め物やスープに向く。",
"トマトは加熱で何が?|加熱で吸収されやすい成分が増える話がある。生と加熱で使い分け。",
"切ったりんごが茶色い?|酸化で色が変わる。レモン汁や薄い塩水で変色が遅くなる。",
"バナナを長持ちさせる?|房の付け根をラップで覆うと黒ずみが遅い。1本ずつ分けても良い。",
"アボカド追熟のコツ?|常温で紙袋に入れると進みやすい。硬い時は冷蔵に入れない方が早い。",
"米は研ぎ過ぎると?|表面を削り甘みが落ちる。最初の水はすぐ捨て、あとは軽くで十分。",
"炊飯の浸水は何分?|夏30分、冬1時間目安。浸水で芯残りが減り、冷めても硬くなりにくい。",
"炊けたらすぐ混ぜる?|底の水分を飛ばし粒を立てる。混ぜないと下がべちゃつきやすい。",
"ご飯冷凍は平らに?|厚いと解凍ムラ。薄く平らにし急冷すると味落ちが少なくなる。",
"味噌は溶かして入れる?|塊だとムラ。だしで溶いてから入れ、火は弱めで香りを守る。",
"スープの味が薄い時?|塩より香りのある醤油少量で締まる。最後に一滴ずつがコツ。",
"スープが濃すぎた時?|水より出汁で伸ばすと薄まりにくい。具を足すのも手。",
"焦げた鍋を無理に削る?|傷の元。水と重曹で温めてふやかすと落ちやすい。",
"包丁は濡れ布で拭く?|滑って危ない。乾いた布で拭き、切るたび整えると安全で速い。",
"まな板は肉用を分ける?|生肉の菌が移るのを防ぐ。色違いにすると迷いが減る。",
"手洗いの順番は?|指先→親指→手首が残りやすい。20秒目安で石けんが確実。",
"弁当は冷まして詰める?|湯気がこもると傷みやすい。完全に冷ましてから蓋が安全。",
"作り置きは小分け?|大鍋だと冷めにくい。浅い容器で冷やすと安全性が上がる。",
"カレー再加熱で焦げる?|底が焦げやすい。弱火で底をこすり、少量の水で調整すると良い。",
"カレーは寝かせると旨い?|油と香辛料がなじみ角が取れる。翌日は味が丸く感じやすい。",
"パン粉は湿気ると?|揚げ色が鈍くなる。袋の口を閉め、乾燥剤でサクッを守る。",
"粉ゼラチンの失敗原因?|熱湯に直入れでダマ。水でふやかしてから温めると滑らか。",
"ホットケーキを休ませる?|生地を10分置くと粉が水を吸う。焼きムラが減りふっくら。",
"バターは焦げやすい?|乳成分が先に焦げる。弱火で溶かし、色づいたら火を止める。",
"オリーブ油は高温弱い?|煙が出ると劣化しやすい。炒めは中火、香り付けは最後が安定。",
"ごま油は最初に入れない?|香りが飛ぶ。炒めは別油、仕上げに数滴で香りが立つ。",
"フライパン予熱の見分け?|水滴が玉になって転がる位が目安。予熱で焼き色が安定する。",
"肉の下味は袋で揉む?|手早く均一に付く。洗い物が減り、香辛料もムラになりにくい。",
"漬け込み長すぎると?|塩が入り過ぎ硬くなることがある。薄味でも短時間を意識すると良い。",
"レモンはいつ搾る?|香りは揮発する。食べる直前に搾ると爽やかさが最大になる。",
"納豆は混ぜると甘い?|混ぜると空気が入り舌触りが軽い。30〜50回で泡立つ人もいる。",
"塩ひとつまみは何g?|およそ0.3g前後と言われる。計量に慣れると味がブレにくい。",
"計量はすり切りが大事?|盛ると誤差が大きい。粉は平らにしてから入れると再現性が上がる",
"液体計量は目線合わせ?|上から見ると多く見える。カップの線を水平に見ると正確になる",
"牛乳はドア側に置かない?|開閉で温度変化が大きい。奥に置くと劣化が遅いことが多い",
"卵は冷蔵庫の奥が良い?|温度が安定する。扉ポケットは揺れと温度差で劣化しやすい",
"冷やし中華が水っぽい?|麺の水切り不足が主因。ザルでよく振り、器も冷やすと締まる",
"辛味は後足しが得?|辛味の香りは飛びやすい。食べる直前に足すとキレが出る",
"昆布は水出しで何が?|低温で甘みの旨味が出やすい。冷蔵で一晩置くと優しいだしになる",
"だし氷って何が便利?|だしを製氷で冷凍。味噌汁や炒め物に1個入れるだけで旨味が足せる"
  ],
  HOME: [
"除湿機の水は飲める?|結露水は雑菌が混じる。タンクの水は飲用にせず捨てるのが安全。",
"重曹とクエン酸混ぜる?|発泡はするが洗浄は相殺しやすい。用途を分ける方が効きやすい。",
"塩素系と酸性を混ぜる?|危険なガスが出る恐れ。洗剤表示の注意は必ず守るのが鉄則。",
"生ゴミ臭は水切り?|水分が臭いを増やす。絞って新聞紙に包むと臭いが減りやすい。",

"牛乳で下痢する子がいる?|乳糖を分解できない場合がある。少量でも下痢なら与えない方が良い。",
"猫は基本洗わなくて良い?|自分で毛づくろいする。汚れた時だけで十分なことが多く、洗い過ぎは皮膚乾燥の元。",
"シャンプー頻度は多いほど?|洗い過ぎで皮膚が乾く。犬種と皮膚状態で違うので、獣医相談が安心。",
"ブラッシングは何のため?|抜け毛だけでなく皮膚チェックになる。コブや赤みを早く見つけやすい。",
"毛玉対策は水分も大事?|猫は水が少ないと毛玉が出やすい話も。ブラシ＋飲水工夫で軽減しやすい。",
"爪切りを嫌がる時は?|寝ている時や少しずつが有効。切った後にご褒美で『怖くない』を作ると慣れやすい。",
"猫の爪とぎが家具に向く?|好みの材質と場所が合っていない。家具近くに爪とぎを置くと移る子がいる。",
"犬のしつけは長時間が良い?|短時間×回数が効く。3分でも毎日やると覚えが早いことが多い。",
"叱るより誘導が早い?|叱ると不安で悪化する子も。望む行動をした瞬間に褒める方が定着しやすい。",
"吠えは黙らせれば良い?|原因が怖さのことも。環境を調整し、距離を取り安心させると減る場合がある。",
"留守番は突然長時間OK?|不安が強まる。短時間から練習し、成功体験を積むと落ち着きやすい。",
"分離不安の入口は?|出入りで大騒ぎが癖になる。出発と帰宅を淡々とすると興奮が減る子がいる。",
"耳が臭いのは汚れ?|外耳炎のことがある。臭い・赤み・かゆみが続くなら早め相談が安心。",
"目やにが増えたら?|乾燥でも増えるが片目だけ強い時は注意。写真を撮って相談すると説明が早い。",
"くしゃみが続く猫は?|猫風邪などがある。食欲や元気も合わせて見て、続くなら相談が無難。",
"食欲と元気が最重要?|便や体温より先に出るサイン。急に食べない・動かないは早め受診が安全。",
"便の観察で分かること?|水分量や色で体調が見える。いつもと違うが数日続くなら相談の材料になる。",
"嘔吐が多いのは毛玉だけ?|頻回は病気のことも。回数・血・元気をメモすると獣医が判断しやすい。",
"多飲多尿は何のサイン?|腎臓や糖の病気の可能性も。急に増えたら早めに相談するのが安心。",
"口臭が強いのは年のせい?|歯周病のことが多い。早めのケアで進行を遅らせやすいと言われる。",
"歯石は家で取れる?|無理に取ると歯が傷む。歯磨き習慣＋必要なら病院処置が安全。",
"歯みがきはいつ始める?|早いほど慣れる。ガーゼで触る→歯ブラシ、と段階で進めると成功しやすい。",
"散歩後の足洗いは毎回?|洗い過ぎで乾燥する子も。基本は拭く、汚れた時だけ洗うで十分な場合がある。",
"肉球がカサカサの時?|乾燥や摩擦が原因。専用クリームで保護すると割れを防げることがある。",
"猫に鈴の首輪は良い?|音がストレスの子がいる。必要なら軽い物、反応を見て調整が無難。",
"新しい猫を迎える手順は?|最初は別室で匂い交換。急に対面させるより、数日〜で慣らすとトラブルが減る。",
"多頭飼いは先住優先が大事?|順番が崩れると不安が増える。食事・挨拶・抱っこの順を守ると落ち着きやすい。",
"遊びは毎日必要?|短時間でも脳の運動になる。特に室内猫は遊び不足が問題行動に繋がることがある。",
"猫じゃらしは終わり方が重要?|捕まえられないと不満が残る。最後に捕まえさせ『狩り完了』で満足しやすい。",
"知育玩具は意味ある?|退屈の解消に効く。留守番前に少し使うと寝て待てる子がいる。",
"噛むおもちゃの利点?|ストレス発散と歯の汚れ軽減に役立つことも。誤飲しないサイズを選ぶのが大前提。",
"観葉植物はペットに危険?|中毒の物がある。かじる癖がある子は届かない場所へ置くと安心。",
"電源コードを噛む対策は?|コードカバーで守る。噛む子は苦味スプレーもあるが、まず物理防御が確実。",
"窓辺が好きな猫の注意点?|脱走と転落が怖い。網戸ロックや柵で安全を作ると安心して日向ぼっこできる。",
"犬の伸縮リードは危険?|距離が伸びて事故が起きやすい。人が多い所は固定長が安全で扱いやすい。",
"うんち拾いは健康チェック?|色や形で体調が見える。拾う時に異変を早く見つけやすい。",
"トイレ掃除は手袋が良い?|人の感染予防になる。特に免疫弱い人や妊娠中は衛生対策が重要。",
"定期健診は元気でも必要?|早期発見で負担が減る。シニアは変化が早いので年1〜2回が安心の目安になりやすい。",
"シニアは何を見れば良い?|食欲・体重・飲水・寝方。小さな変化が病気の最初のサインのことがある。",
"人の薬を与えるのは?|極めて危険。少量でも中毒の恐れがあるので、必ず獣医の指示が必要。",
"薬は自己判断で止める?|中途で悪化することも。症状が良くても指示通りの期間を守る方が安全。",
"写真を撮ると何が助かる?|嘔吐や便、歩き方の変化を見せられる。口で説明より診断の助けになることが多い。",
"キャリーは普段から出す?|いきなり出すと怖がる。部屋に置いて隠れ家にすると、病院移動が楽になる子がいる。",
"病院が苦手な子の工夫は?|移動前に遊びで発散、タオルで匂いを落ち着かせると緊張が減る場合がある。",
"真夏の車内は何分で危険?|短時間でも急上昇する。エアコン停止の車内放置は絶対に避けるのが安全。",
"冬の寒さは犬猫に平気?|小型や短毛は冷えやすい。寝床を暖かくし、床の冷えを避けると体調が安定しやすい。",
"寝床はどこが良い?|静かで人の通り道から外れた所。安心できる場所があると問題行動が減る子がいる。",
"雷が怖い子への対策は?|隠れられる場所を作る。音を遮るカーテンや、飼い主が落ち着くのも効果が出やすい。",
"掃除機が怖い子の慣らし方?|距離を取り、音が小さい段階から。おやつで『怖くない』を積むと改善する子がいる。",
"首輪が抜けやすい時は?|サイズと毛の滑りが原因も。ハーネス併用や二重リードで事故を防げる。",
"食器の高さは関係ある?|首に負担がある子は高さが楽。特にシニアや短頭種は工夫で食べやすくなる場合がある。",
"早食いの犬の対策は?|早食い防止皿が有効なことも。空気を飲んで吐く子は特にゆっくりが大事。",
"猫が吐く頻度の目安は?|毛玉でも頻回は要注意。週に何度も続くなら、回数と状況をメモして相談が安心。",
"犬が足を舐め続ける?|アレルギーや痛みのことも。赤みや臭いがあるなら早めに見てもらうと安心。",
"猫が鳴き続ける理由?|要求だけでなく不安や痛みのことも。急に変わった鳴き方は注意して様子を見る。",
"避妊去勢で太る?|代謝が変わる子がいる。フード量と運動を調整すると体重が安定しやすい。",
"ペットの口の中を見る?|口内炎や歯の異常を早期発見できる。週1でも見る習慣があると変化に気づきやすい",
"耳掃除をやり過ぎると?|刺激で炎症が悪化することも。基本は外側だけ、奥は獣医に任せるのが安全",
"シャンプー後に震える?|寒さやストレスのことも。完全に乾かし、静かな場所で休ませると落ち着きやすい",
"散歩に行けない日は?|匂い遊びが代替になる。室内でおやつ探しをすると疲れ方が散歩に近いことがある"
  ]
};

const LABEL = {
  ALL:"全ジャンル",
  COOK:"お料理豆知識",
  HOME:"家庭生活豆知識",
  KIDS:"育児豆知識",
  APPL:"家電豆知識",
  PETS:"ペット豆知識"
};

const SHORT = {
  COOK:"料理",
  HOME:"家庭",
  KIDS:"育児",
  APPL:"家電",
  PETS:"ペット"
};

const NUMMAP = {};
Object.keys(DATA).forEach(k=>{
  NUMMAP[k] = {};
  DATA[k].forEach((s,i)=>{ NUMMAP[k][s] = i+1; });
});

let currentKey = "ALL";
let lastIndex = -1;
let lastKey = "ALL";

function poolForKey(key){
  if(key==="ALL"){
    return [
      ...DATA.COOK.map(s=>"COOK||"+s),
      ...DATA.HOME.map(s=>"HOME||"+s),
      ...DATA.KIDS.map(s=>"KIDS||"+s),
      ...DATA.APPL.map(s=>"APPL||"+s),
      ...DATA.PETS.map(s=>"PETS||"+s)
    ];
  }else{
    return DATA[key].map(s=>key+"||"+s);
  }
}

function randInt(max){
  return Math.floor(Math.random()*max);
}

function showRandom(){
  const pool = poolForKey(currentKey);
  if(!pool.length){ return; }

  let idx = randInt(pool.length);
  if(pool.length>1){
    for(let i=0;i<6 && idx===lastIndex && currentKey===lastKey;i++){
      idx = randInt(pool.length);
    }
  }

  const raw = pool[idx];
  const [g, rest] = raw.split("||");
  const [q, a] = rest.split("|");

  document.getElementById("genreTag").textContent = LABEL[g] || LABEL[currentKey];
  document.getElementById("qText").textContent = q;
  document.getElementById("aText").textContent = a;

  const n = (NUMMAP[g] && NUMMAP[g][rest]) ? NUMMAP[g][rest] : (idx + 1);
  document.getElementById("qidTag").textContent = `${SHORT[g] || ""}${n}`;

  const total = (currentKey==="ALL") ? 500 : 100;
  document.getElementById("statLine").textContent =
    `${LABEL[currentKey]}：全${total}問からランダム表示（記憶なし）。`;

  lastIndex = idx;
  lastKey = currentKey;
}

function setActiveChip(key){
  currentKey = key;
  const chips = document.querySelectorAll(".chip");
  chips.forEach(c=>{
    c.classList.toggle("active", c.getAttribute("data-key")===key);
  });
  showRandom();
}

document.getElementById("btnBack").addEventListener("click", ()=>{
  location.href = "game.html";
});

document.getElementById("btnNext").addEventListener("click", ()=>{
  showRandom();
});

document.getElementById("chipRow").addEventListener("click", (e)=>{
  const t = e.target;
  if(!t.classList.contains("chip")) return;
  const key = t.getAttribute("data-key");
  setActiveChip(key);
});

showRandom();
</script>
</body>
</html>
