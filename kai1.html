<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>介護福祉士 訓練｜介護の基本</title>
  <style>
    :root{
      --blue:#1e88e5; --bg:#eef6ff; --card:#fff; --txt:#0b1b2b; --muted:#4a5a6a; --border:#9cc7ff;
      --blinkPink:#ff5aa5; --blinkBlue:#1f6fff;
    }
    body{ margin:0; font-family: system-ui, -apple-system, "Segoe UI", Roboto, "Noto Sans JP", sans-serif; background:var(--bg); color:var(--txt); }
    .wrap{ max-width:900px; margin:0 auto; padding:14px; }
    .bar{ background:#dcebff; border:2px solid var(--border); border-radius:14px; padding:12px; }
    .title{ margin:0; font-size:18px; font-weight:900; }
    .meta{ margin:6px 0 0; color:var(--muted); font-size:13px; line-height:1.5; }
    .card{ margin-top:12px; background:var(--card); border:2px solid var(--border); border-radius:14px; padding:12px; box-shadow:0 2px 10px rgba(0,0,0,.06); }
    .qid{ font-weight:900; margin:0 0 8px; }
    .qtext{ margin:0 0 10px; line-height:1.55; }
    .opt{
      padding:12px 12px;
      border:2px solid #d5e8ff;
      border-radius:12px;
      margin:8px 0;
      background:#fbfdff;
      user-select:none;
      cursor:pointer;
      line-height:1.45;
      font-weight:700;
    }
    .opt:active{ transform: translateY(1px); }
    .opt .lead{ font-weight:900; margin-right:6px; }

    .btns{ display:flex; gap:8px; flex-wrap:wrap; margin-top:12px; }
    button{
      border:2px solid var(--blue); background:#fff; color:var(--blue);
      padding:10px 12px; border-radius:12px; font-weight:900; cursor:pointer;
    }
    button.primary{ background:var(--blue); color:#fff; }
    button.danger{ border-color:#d32f2f; color:#d32f2f; }
    button:disabled{ opacity:.5; cursor:not-allowed; }

    .progress{ margin-top:10px; height:10px; background:#dbeeff; border-radius:999px; overflow:hidden; border:1px solid #b8d8ff; }
    .progress > div{ height:100%; width:0%; background:var(--blue); }

    @keyframes blinkHalf { 0%{opacity:1;} 50%{opacity:.15;} 100%{opacity:1;} }
    .blink-pink{ border-color:var(--blinkPink)!important; background:rgba(255,90,165,.14)!important; animation: blinkHalf 0.5s linear infinite; }
    .blink-blue{ border-color:var(--blinkBlue)!important; background:rgba(31,111,255,.12)!important; animation: blinkHalf 0.5s linear infinite; }
    .fast{ animation-duration: 0.25s !important; }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="bar">
      <p class="title" id="genreTitle"></p>

    </div>

    <div class="card">
      <p class="qid" id="qid"></p>

      <div id="opts"></div>

        <button onclick="goHome()">表紙へ</button>
        <button class="danger" onclick="resetThis()">このジャンルをリセット</button>
      </div>
    </div>

  const K_PROGRESS = `kai_progress_g${GENRE_ID}`;
  const K_ANSWERS  = `kai_answers_g${GENRE_ID}`;
  const K_STREAK   = `kai_wrongstreak_g${GENRE_ID}`;
  const K_UPDATED  = `kai_updated_g${GENRE_ID}`;

  function fmt3(n){ return String(n).padStart(3,"0"); }
  function fmt4(n){ return String(n).padStart(4,"0"); }

  let idx = 0;
  let answers = new Array(100).fill(null);
  let wrongStreak = new Array(100).fill(0);

  function loadState(){
    const p = Number(localStorage.getItem(K_PROGRESS));
    if (Number.isFinite(p) && p >= 0 && p < 100) idx = p;

    const a = localStorage.getItem(K_ANSWERS);
    if (a){ try { const x = JSON.parse(a); if (Array.isArray(x) && x.length === 100) answers = x; } catch(e){} }

    const s = localStorage.getItem(K_STREAK);
    if (s){ try { const x = JSON.parse(s); if (Array.isArray(x) && x.length === 100) wrongStreak = x; } catch(e){} }
  }

  function saveState(){
    localStorage.setItem(K_PROGRESS, String(idx));
    localStorage.setItem(K_ANSWERS, JSON.stringify(answers));
    localStorage.setItem(K_STREAK, JSON.stringify(wrongStreak));
    localStorage.setItem(K_UPDATED, new Date().toLocaleString("ja-JP"));
  }

  function render(){
    document.getElementById("genreTitle").textContent = GENRE_TITLE;

    const globalNo = OFFSET + idx + 1;
    const withinNo = idx + 1;

    document.getElementById("qid").textContent =
      `通し番号 ${fmt4(globalNo)} ／ ジャンル内 ${fmt3(withinNo)}（苦情用ID）`;

    document.getElementById("qtext").textContent = questions[idx].text;

    const answeredCount = answers.filter(v => v !== null).length;
    document.getElementById("meta").innerHTML =
      `進捗：<b>${withinNo}</b> / 100　回答済み：<b>${answeredCount}</b> / 100　（連続ミス：<b>${wrongStreak[idx]}</b>）`;

    document.getElementById("pbar").style.width = `${Math.round((withinNo/100)*100)}%`;

    const box = document.getElementById("opts");
    box.innerHTML = "";

    const picked = answers[idx];
    const ans = questions[idx].answer;
    const judged = (picked !== null);

    document.getElementById("nextBtn").disabled = !judged;

    const speedUp = (wrongStreak[idx] >= 2);

    questions[idx].choices.forEach((c, i) => {
      const div = document.createElement("div");
      div.className = "opt";
      div.innerHTML = `<span class="lead">${["A","B","C","D"][i]}.</span>${c}`;

      if (judged){
        if (picked === ans && i === picked) {
          div.classList.add("blink-pink");
          if (speedUp) div.classList.add("fast");
        }
        if (picked !== ans && i === ans) {
          div.classList.add("blink-blue");
          if (speedUp) div.classList.add("fast");
        }
      }

      div.addEventListener("click", () => {
        const chosen = i;
        const correct = (chosen === ans);

        answers[idx] = chosen;

        if (correct) {
          wrongStreak[idx] = 0;
        } else {
          wrongStreak[idx] = (wrongStreak[idx] || 0) + 1;
        }

        saveState();
        render();
      });

      box.appendChild(div);
    });

    saveState();
  }

  function next(){ if (idx < 99){ idx++; render(); } else { alert("このジャンルは最後まで到達しました。表紙へ戻れます。"); } }
  function prev(){ if (idx > 0){ idx--; render(); } }
  function goHome(){ saveState(); location.href = "kai_home.html"; }

  function resetThis(){
    if(!confirm("このジャンルの進捗・回答・連続ミスを削除します。よろしいですか？")) return;
    localStorage.removeItem(K_PROGRESS);
    localStorage.removeItem(K_ANSWERS);
    localStorage.removeItem(K_STREAK);
    localStorage.removeItem(K_UPDATED);
    idx = 0;
    answers = new Array(100).fill(null);
    wrongStreak = new Array(100).fill(0);
    render();
  }

  loadState();
  render();
</script>
